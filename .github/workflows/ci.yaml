name: CI

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Install gems
        run: nix develop -c bundle install

      - name: Run tests
        run: nix develop -c bundle exec rake spec

      - name: Run Rake
        run: nix develop -c bundle exec rake
